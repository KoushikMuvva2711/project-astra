name: astra

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-astra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-astra-local-dev}
      POSTGRES_DB: ${POSTGRES_DB:-astra}
      # Astra is single-user and latency-sensitive on small queries.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — never expose the DB to the tunnel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-astra} -d ${POSTGRES_DB:-astra}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly so the curator's consumer-group cursor survives a restart.
    # Losing it would mean reprocessing or dropping events. See memory-design.md §7.
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/app          # dev hot-reload; drop this in production
      - astra_models:/models
    ports:
      - "127.0.0.1:8000:8000"   # the tunnel fronts this; not exposed directly
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach host Ollama
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/live',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── GPU profile ────────────────────────────────────────────────────────────
  # Voice services land in Phase 2. Declared now so the compose topology is
  # stable and `--profile gpu` is a no-op until then.
  #
  #   docker compose --profile gpu up -d
  #
  # voice:
  #   build: {context: ./backend, dockerfile: Dockerfile.voice}
  #   profiles: [gpu]
  #   deploy:
  #     resources:
  #       reservations:
  #         devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

volumes:
  postgres_data:
  redis_data:
  astra_models:
