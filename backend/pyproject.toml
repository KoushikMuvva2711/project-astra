[project]
name = "astra-backend"
version = "0.1.0"
description = "Project Astra — voice-first personal AI constellation"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",   # alembic runs sync; asyncpg is for the app
    "alembic>=1.14",
    "pgvector>=0.3.6",

    "redis>=5.2",

    # Wake-name routing. Names arrive through a speech recogniser, so matching is
    # phonetic + fuzzy, never string equality. See docs/conversation-architecture.md §4.
    "metaphone>=0.6",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",

    "structlog>=24.4",
    "python-json-logger>=2.0",

    # zoneinfo reads the IANA database from the operating system. Debian and the
    # GitHub runners ship one, so the container and CI work by accident; Windows
    # ships none, and a minimal image may not either. Selene resolves every
    # reminder through ZoneInfo("Asia/Kolkata"), so without this the whole
    # feature raises ZoneInfoNotFoundError on any host that happens to lack it.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # Pinned exactly, unlike the others. A linter is a gate, and an unpinned gate
    # fails on commits that changed nothing the day a new rule ships — which is
    # exactly what happened with `>=0.8`. Bump this deliberately, not by surprise.
    "ruff==0.16.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 flags function calls in argument defaults. `Depends(...)` in a default is
# the documented FastAPI idiom, so the rule is noise in this codebase.
ignore = ["B008"]

[tool.ruff.lint.isort]
# Stated rather than inferred. Ruff usually works `app` out from the directory
# layout, but that inference depends on where it is invoked from, and when it
# fails `app` is treated as third-party: `import app.db.models` then sorts above
# alembic and sqlalchemy, and the same file passes locally while failing in CI.
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
